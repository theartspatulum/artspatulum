# The Art Spa Tulum — Netlify config
[build]
  publish = "site"
  # Every deploy rebuilds the pages and pulls live prices/treatments from SimplyBook.
  command = "python3 build/build.py"
  functions = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.12"

# Force the www domain + HTTPS (set www.theartspatulum.mx as primary domain in Netlify)
[[redirects]]
  from = "https://theartspatulum.mx/*"
  to = "https://www.theartspatulum.mx/:splat"
  status = 301
  force = true

# Short, shareable booking links
[[redirects]]
  from = "/reservar"
  to = "/es/reservar/"
  status = 301
[[redirects]]
  from = "/booking"
  to = "/book/"
  status = 301
[[redirects]]
  from = "/menu"
  to = "/treatments/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Frame-Options = "SAMEORIGIN"

# CSS/JS carry a ?v= version tag that changes with every edit, so they can be cached long.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
# Photos can be replaced under the same name, so browsers re-check them daily.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
